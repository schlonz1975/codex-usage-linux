name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
    - type: markdown
      attributes:
          value: Do not include Codex credentials, prompts, or private account data.
    - type: textarea
      id: description
      attributes:
          label: Description
          description: What happened, and what did you expect?
      validations:
          required: true
    - type: input
      id: distribution
      attributes:
          label: Linux distribution and version
      validations:
          required: true
    - type: input
      id: desktop
      attributes:
          label: Desktop environment and version
      validations:
          required: true
    - type: input
      id: codex
      attributes:
          label: Codex CLI version
          description: Output of `codex --version`
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Reproduction steps
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Relevant logs
          render: shell
